project:
  name: "CompressRoute"
  seed: 42
  device: "cpu"

dataset:
  name: "banking77"
  num_labels: 77
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_seq_length: 128
  fast_subset_size: 500

models:
  teacher:
    name: "bert-base-uncased"
    checkpoint_dir: "models/teacher_bert"
  baseline:
    name: "distilbert-base-uncased"
    checkpoint_dir: "models/baseline_distilbert"
  student:
    name: "student_custom"
    checkpoint_dir: "models/student_distilled"
    num_hidden_layers: 4

training:
  learning_rate: 2.0e-5
  batch_size: 32
  num_epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.1
  fast:
    num_epochs: 1
    batch_size: 16
    subset_size: 500

distillation:
  temperature: 3.0
  alpha: 0.5

quantization:
  calibration_samples: 200

benchmark:
  warmup_runs: 20
  timed_runs: 100
  batch_sizes: [1, 8, 32, 64]
  sequence_lengths: [32, 128]
  threads: 4
  results_file: "benchmark/results/registry.json"

selector:
  presets:
    max_accuracy:
      w_acc: 0.70
      w_lat: 0.15
      w_mem: 0.10
      w_thr: 0.05
    balanced:
      w_acc: 0.35
      w_lat: 0.35
      w_mem: 0.15
      w_thr: 0.15
    fastest:
      w_acc: 0.10
      w_lat: 0.60
      w_mem: 0.10
      w_thr: 0.20
    edge:
      w_acc: 0.20
      w_lat: 0.30
      w_mem: 0.40
      w_thr: 0.10
